<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>GTD</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --accent:#1f3a5f; --muted:#6b7280; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#e8eaed; --card:#1a1f26; --accent:#7aa2d6; --muted:#9aa3ae; --line:#2a313b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,"Yu Gothic UI",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  nav { display:flex; gap:4px; margin-bottom:12px; }
  nav button { flex:1; padding:10px 4px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; font:inherit; font-size:14px; }
  nav button[aria-selected="true"] { background:var(--accent); color:#fff; border-color:var(--accent); }
  form { display:flex; gap:8px; margin-bottom:12px; }
  input { flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; }
  .add { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; }
  ul { list-style:none; margin:0; padding:0; }
  li { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .text { word-break:break-word; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .row button { padding:4px 10px; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:6px; font:inherit; font-size:13px; }
  .empty { color:var(--muted); text-align:center; padding:24px 0; }
</style>
</head>
<body>
<main>
  <nav id="tabs" role="tablist"></nav>
  <form id="form">
    <input id="input" placeholder="頭に浮かんだことを、まず受信箱へ" autocomplete="off">
    <button class="add" type="submit">追加</button>
  </form>
  <ul id="list"></ul>
</main>
<script src="app.js"></script>
</body>
</html>
